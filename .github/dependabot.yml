version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for routine updates; majors still get their own.
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Types must match the Node major in .nvmrc (24); newer types allow APIs that fail at runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # init and analyze must be on the same version, or the CodeQL job fails.
      codeql-action:
        patterns: ["github/codeql-action*"]
