name: Ingest FTC data

# Backup for the Supabase pg_cron job (README → Unwanted-call trends), which is
# the main schedule: GitHub drops many scheduled runs. Odd minutes avoid the
# busiest times. Each run skips work already done, so overlaps are cheap.
# Vercel Cron (vercel.json) also runs daily.
#
# Minutes: this repo is public, so GitHub-hosted runners are free. If it went
# private: at most 16 runs x ~22 weekdays x 5 billed minutes = 1,760 min/month
# (typically far less: runs that skip finish in under a minute), under the
# Free plan's 2,000.
on:
  schedule:
    - cron: "7,22,37,52 17-20 * * 1-5"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ingest-ftc
  cancel-in-progress: false

jobs:
  ingest:
    if: github.repository == 'hawl3y/byebell'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call the ingest endpoint
        env:
          CRON_SECRET: ${{ secrets.PROD_CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 320 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://byebell.com/api/cron/ingest
          echo
